name: CI/CD · 构建镜像并部署到阿里云

# 触发条件：推送到 main 分支，或手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支的部署串行执行，避免并发重建容器造成抖动
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Docker Hub 镜像名（用户名来自 Secret），例如 bobjackson/homepage
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/homepage

jobs:
  # ========== Job 1：构建并推送镜像到 Docker Hub ==========
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== Job 2：SSH 登录阿里云，拉取新镜像并重新部署 ==========
  deploy:
    name: 部署到阿里云
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 通过 SSH 重新部署容器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: ${{ secrets.ALIYUN_PORT || 22 }}
          script_stop: true
          # 传递给远程脚本的环境变量
          envs: IMAGE_NAME,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,APP_PORT
          script: |
            set -euo pipefail

            IMAGE="${IMAGE_NAME}:latest"
            PORT="${APP_PORT:-8080}"

            echo "==> 登录 Docker Hub"
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            echo "==> 拉取最新镜像：$IMAGE"
            docker pull "$IMAGE"

            echo "==> 重新部署容器 homepage（宿主机端口 $PORT）"
            docker rm -f homepage >/dev/null 2>&1 || true
            docker run -d \
              --name homepage \
              --restart unless-stopped \
              -p "${PORT}:80" \
              "$IMAGE"

            echo "==> 清理悬空镜像，回收磁盘"
            docker image prune -f

            docker logout >/dev/null 2>&1 || true

            echo "==> 当前容器状态"
            docker ps --filter "name=homepage" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "✅ 部署完成：容器 homepage 已在宿主机端口 ${PORT} 重新运行"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          APP_PORT: ${{ vars.APP_PORT }}
