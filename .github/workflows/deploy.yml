name: CI/CD · 构建镜像并部署到阿里云

# 触发条件：推送到 main 分支，或手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支的部署串行执行，避免并发重建容器造成抖动
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Docker Hub 镜像名（用户名来自 Secret），例如 bobjackson/homepage
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/homepage

jobs:
  # ========== Job 1：构建并推送镜像到 Docker Hub（留档） ==========
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== Job 2：runner 拉取镜像，经 SSH 直传服务器 docker load ==========
  # 服务器完全不访问 Docker Hub：镜像由 GitHub runner 通过 SSH 流式传输，无需代理
  deploy:
    name: 部署到阿里云
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/homepage:latest
      SSH_HOST: ${{ secrets.ALIYUN_HOST }}
      SSH_USER: ${{ secrets.ALIYUN_USER }}
      SSH_PORT: ${{ secrets.ALIYUN_PORT || 22 }}
      APP_PORT: ${{ vars.APP_PORT || 28081 }}
    steps:
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 拉取镜像到 runner
        run: docker pull "$IMAGE"

      - name: 准备 SSH 密钥
        env:
          SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: 传输镜像并重启容器
        run: |
          set -euo pipefail
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o Compression=no \
                    -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT")

          echo "==> 通过 SSH 传输镜像（约 20MB，gzip 后更小）"
          docker save "$IMAGE" | gzip -1 | \
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" 'gunzip | docker load'

          echo "==> 重建容器 homepage（宿主机端口 ${APP_PORT}）"
          ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "set -e
             docker rm -f homepage >/dev/null 2>&1 || true
             docker run -d --name homepage --restart unless-stopped -p ${APP_PORT}:80 ${IMAGE}
             docker image prune -f >/dev/null
             docker ps --filter name=homepage --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"

          echo "✅ 部署完成：容器 homepage 已在宿主机端口 ${APP_PORT} 重新运行"
