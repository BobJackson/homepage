# ============================================================
# 个人主页 · 中央 Nginx 反向代理配置
# ------------------------------------------------------------
# 用途：接入服务器上已有的 nginx 容器（80/443 + HTTPS），
#       将域名请求反代到主页容器发布的宿主机端口 10087。
#
# 部署方式：
#   1) 将本文件放入 nginx 容器挂载的 conf.d 目录
#      （通常是宿主机某目录 -> 容器 /etc/nginx/conf.d/）
#   2) 替换下方 3 处占位符：域名、证书路径、proxy_pass 目标
#   3) 校验并重载：docker exec nginx nginx -t && docker exec nginx nginx -s reload
# ============================================================

# ---------- HTTP：全部跳转到 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name homepage.example.com;          # ← 占位符①：改成你的域名

    # Let's Encrypt 续期挑战（如用 certbot webroot 模式，保留此行）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：反向代理到主页容器 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name homepage.example.com;          # ← 占位符①：改成你的域名

    # ← 占位符②：改成你为该域名准备的证书路径（与其他站点一致即可）
    ssl_certificate     /etc/nginx/certs/homepage.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/homepage.example.com/privkey.pem;

    # TLS 加固
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头（HSTS 视情况开启）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 上传/请求体大小（静态站点无需太大）
    client_max_body_size 10m;

    location / {
        # ← 占位符③：反代目标，三选一，与你现有站点保持一致：
        #   (a) 宿主机 Docker 默认网桥网关：http://172.17.0.1:10087
        #   (b) host.docker.internal（需 nginx 容器以 --add-host 启动）：http://host.docker.internal:10087
        #   (c) 若主页容器与 nginx 处于同一自定义网络：http://homepage:80
        proxy_pass http://172.17.0.1:10087;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # 健康检查透传（可选，便于外部探活）
    location = /healthz {
        proxy_pass http://172.17.0.1:10087/healthz;   # ← 同占位符③
        access_log off;
    }
}
