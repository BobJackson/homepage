# ============================================================
# me.wangyousong.com · 个人主页反向代理配置
# ------------------------------------------------------------
# 本文件与服务器实际运行的 /etc/nginx/conf.d/me.conf 保持一致。
# 复用现有 nginx 约定：
#   · 证书：/etc/ssl/cert/fullchain.cer + /etc/ssl/cert/*.wangyousong.com.key
#           （泛域名 *.wangyousong.com，覆盖 me 子域名）
#   · 反代：经 Docker 网关 172.20.0.1 访问主页容器发布的宿主机端口 28081
#   · 结构：80 端口 301 跳转 HTTPS，443 反代到后端
#
# 变更部署：拷入 nginx 容器 conf.d 目录（me.conf）→ nginx -t → nginx -s reload
# ============================================================

server {
    listen 80;
    server_name me.wangyousong.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name me.wangyousong.com;
    access_log  /var/log/nginx/me.access.log;
    error_log  /var/log/nginx/me.error.log;

    ssl_certificate   /etc/ssl/cert/fullchain.cer;
    ssl_certificate_key  /etc/ssl/cert/*.wangyousong.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    location / {
        proxy_pass http://172.20.0.1:28081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
