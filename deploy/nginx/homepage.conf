# ============================================================
# me.wangyousong.com · 个人主页反向代理配置
# ------------------------------------------------------------
# 复用服务器现有 nginx 约定（与 hotels/books/growth 等站点一致）：
#   · 证书：/etc/ssl/cert/fullchain.cer（泛域名 *.wangyousong.com）
#   · 反代：经网关 172.20.0.1 访问主页容器发布的宿主机端口 28081
#   · 结构：80 端口 301 跳转 HTTPS，443 反代到后端
#
# 放置：拷入 nginx 容器挂载的 conf.d 目录 → nginx -t 校验 → nginx -s reload
# ============================================================

# ---------- HTTP：跳转到 HTTPS ----------
server {
    listen 80;
    server_name me.wangyousong.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：反向代理到主页容器 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name me.wangyousong.com;

    # 与现有站点共用同一张泛域名证书
    ssl_certificate     /etc/ssl/cert/fullchain.cer;
    ssl_certificate_key /etc/ssl/cert/fullchain.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        # 经 Docker 网关访问宿主机 28081（主页容器发布的端口）
        proxy_pass http://172.20.0.1:28081;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
