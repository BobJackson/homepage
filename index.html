    <!-- 语言预检测：在 React 挂载前同步 <html lang>，与 localStorage 偏好保持一致（避免闪烁） -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('wys-lang')
          var lang =
            stored === 'zh' || stored === 'en'
              ? stored
              : (navigator.languages || []).some(function (l) {
                  return /^zh/i.test(l)
                })
                ? 'zh'
                : 'en'
          document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en'
        } catch (e) {
          /* 隐私模式等场景下降级为默认中文 */
        }
      })()
    </script>
